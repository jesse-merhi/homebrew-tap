# brew tap-new uses this file to generate a PR test workflow for the new tap
name: brew test-bot

on:
  push:
    branches:
      - main
  pull_request:

permissions: {}

defaults:
  run:
    shell: bash -xeuo pipefail {0}

jobs:
  test-bot:
    strategy:
      fail-fast: false
      matrix:
        os: [ macos-26 ]
        include:
          - os: ubuntu-latest
            container:
              image: ghcr.io/homebrew/brew:main@sha256:330b74dcb6e037bdcef41d9f0f107258f6864efcb77ddce5d3456eea3626525c
              options: --privileged
    runs-on: ${{ matrix.os }}
    container: ${{ fromJSON(toJSON(matrix.container)) }} # zizmor: ignore[unpinned-images]
    permissions:
      actions: read
      checks: read
      contents: read
      pull-requests: read
    steps:
      - name: Set up Homebrew
        id: set-up-homebrew
        uses: Homebrew/actions/setup-homebrew@8f3d1ec8a696b3b9d9a6c3696b6c73033cab69e4 # 2026.08.14.1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Cache Homebrew Bundler RubyGems
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ steps.set-up-homebrew.outputs.gems-path }}
          key: ${{ matrix.os }}-rubygems-${{ steps.set-up-homebrew.outputs.gems-hash }}
          restore-keys: ${{ matrix.os }}-rubygems-

      - run: brew test-bot --only-cleanup-before

      - run: brew test-bot --only-setup

      - run: brew test-bot --only-tap-syntax
      - run: brew test-bot --only-formulae
        if: github.event_name == 'pull_request'

      - name: Test release-published cxa formula
        if: github.event_name == 'push'
        env:
          BEFORE_SHA: ${{ github.event.before }}
          TAP_NAME: ${{ steps.set-up-homebrew.outputs.tap-name }}
          TAP_PATH: ${{ steps.set-up-homebrew.outputs.repository-path }}
        run: |
          previous_formula=false
          zero_sha=0000000000000000000000000000000000000000
          if [[ "$BEFORE_SHA" != "$zero_sha" ]]; then
            if ! git -C "$TAP_PATH" cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              git -C "$TAP_PATH" fetch --no-tags --depth=1 origin "$BEFORE_SHA"
            fi
            if ! git -C "$TAP_PATH" cat-file -e "$BEFORE_SHA^{commit}" 2>/dev/null; then
              echo "Could not inspect the previous tap commit $BEFORE_SHA."
              exit 1
            fi
            if git -C "$TAP_PATH" cat-file -e "$BEFORE_SHA:Formula/cxa.rb" 2>/dev/null; then
              previous_formula=true
            fi
          fi
          if [[ ! -f "$TAP_PATH/Formula/cxa.rb" ]]; then
            if [[ "$previous_formula" == true ]]; then
              echo "Formula/cxa.rb was removed from the tap."
              exit 1
            fi
            echo "Formula/cxa.rb has not been published yet."
            exit 0
          fi
          audit_args=(--strict --online)
          if [[ "$previous_formula" == false ]]; then
            audit_args+=(--new)
          fi
          brew audit "${audit_args[@]}" "$TAP_NAME/cxa"
          brew install "$TAP_NAME/cxa"
          brew test "$TAP_NAME/cxa"

      - name: Upload bottles as artifact
        if: always() && github.event_name == 'pull_request'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: bottles_${{ matrix.os }}
          path: '*.bottle.*'
